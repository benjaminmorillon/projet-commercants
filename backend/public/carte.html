<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Projet Commerçant — Carte</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css" />
  <link rel="stylesheet" href="carte.css" />
</head>
<body class="carte-body">
  <!-- La carte occupe tout l'écran ; l'interface flotte par-dessus. -->
  <div id="carte"></div>

  <div class="carte-overlay">

    <div class="carte-filtres" id="carte-filtres">
      <button type="button" class="chip active" data-filtre="tout">Tout</button>
      <button type="button" class="chip" data-filtre="solo">Solo</button>
      <button type="button" class="chip" data-filtre="duo">Duo</button>
      <button type="button" class="chip" data-filtre="disponible">À faire</button>
      <button type="button" class="chip" data-filtre="bonus">Bonus</button>
    </div>
  </div>

  <div class="carte-outils">
    <button type="button" id="btn-3d" class="outil outil-texte" title="Basculer 2D / 3D">3D</button>
    <button type="button" id="btn-nord" class="outil" title="Remettre le nord en haut" aria-label="Remettre le nord en haut">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 16.4 20 12 16.6 7.6 20Z"/></svg>
    </button>
    <button type="button" id="btn-position" class="outil" title="Me localiser" aria-label="Me localiser">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.6v3.2M12 18.2v3.2M2.6 12h3.2M18.2 12h3.2"/></svg>
    </button>
    <button type="button" id="btn-batiments" class="outil" title="Afficher les bâtiments en 3D" aria-label="Afficher les bâtiments en 3D">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20.5V8.2l6-3.4v15.7M10 20.5h10V11l-10-2.8"/><path d="M13.4 13.4h.01M16.8 13.4h.01M13.4 16.6h.01M16.8 16.6h.01M6.6 11h.01M6.6 14.4h.01"/></svg>
    </button>
    <button type="button" id="btn-tout-voir" class="outil" title="Voir tous les partenaires" aria-label="Voir tous les partenaires">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5H3.5V9M15 3.5h5.5V9M9 20.5H3.5V15M15 20.5h5.5V15"/></svg>
    </button>
  </div>

  <p id="carte-message" class="carte-message" hidden></p>

  <!-- Fiche partenaire : panneau qui remonte depuis le bas de l'écran. -->
  <section id="fiche" class="fiche" hidden aria-live="polite">
    <button type="button" class="fiche-fermer" id="fiche-fermer" aria-label="Fermer">×</button>
    <div class="fiche-poignee"></div>
    <div id="fiche-contenu"></div>
  </section>

  <div id="fiche-fond" class="fiche-fond" hidden></div>

  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script src="nav.js"></script>
  <script src="utils.js"></script>
  <script src="carte.js"></script>
</body>
</html>
